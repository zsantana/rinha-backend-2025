# -----------------------------
# Redis Config para Cache Puro
# -----------------------------

# Desativa snapshots RDB
save ""

# Desativa Append-Only File (AOF)
appendonly no

# Máximo de conexões simultâneas
maxclients 20000

# TCP backlog (fila de conexões pendentes)
tcp-backlog 8192

# Desconecta clientes inativos após 5 minutos
timeout 300

# TCP keepalive para detectar conexões mortas
tcp-keepalive 300

# Threads de I/O para leitura paralela (apenas útil em cargas intensivas)
# io-threads 8
# io-threads-do-reads yes

# Logging
loglevel warning

# # Configurações de hash para otimizar estruturas pequenas
# hash-max-listpack-entries 1024
# hash-max-listpack-value 1024

# # Configurações de lista para otimizar estruturas pequenas  
# list-max-listpack-size -2

# # # Configurações de set para otimizar estruturas pequenas
# # set-max-intset-entries 1024

# # Configurações de zset para otimizar estruturas pequenas
# zset-max-listpack-entries 256
# zset-max-listpack-value 128

# # Frequency de execução de tasks em background (menor = mais responsivo)
# hz 100

# # # Configurações de cliente para alta concorrência
# # client-output-buffer-limit normal 0 0 0
# # client-output-buffer-limit replica 256mb 64mb 60
# # client-output-buffer-limit pubsub 32mb 8mb 60

# # Lazy free para operações assíncronas
# lazyfree-lazy-eviction yes
# lazyfree-lazy-expire yes
# lazyfree-lazy-server-del yes