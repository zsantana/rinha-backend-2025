worker_processes auto;
worker_rlimit_nofile 65536;  # Aumentando significativamente o limite para cenários de alta carga
worker_priority -5;           # Prioridade mais alta para os workers do NGINX

events {
    worker_connections 8192;  # Aumentando para suportar mais conexões simultâneas
    multi_accept on;          # Aceita múltiplas conexões em um único evento
    use epoll;               # Mecanismo de eventos otimizado para Linux
    accept_mutex off;        # Desabilita mutex para melhor performance em múltiplos workers
}

error_log /dev/null crit;   # Minimiza logging para máxima performance

http {
    # Logging otimizado
    access_log off;
    
    # Otimizações gerais de performance
    sendfile on;                    # Usa sendfile() para transferência eficiente de arquivos
    tcp_nopush on;                  # Otimiza envio de dados TCP
    tcp_nodelay on;                 # Desabilita algoritmo de Nagle para menor latência
    keepalive_timeout 65;           # Mantém conexões ativas por mais tempo
    keepalive_requests 10000;       # Permite mais requests por conexão keep-alive
    
    # Otimizações de buffer
    client_body_buffer_size 16k;    # Buffer otimizado para requests pequenos/médios
    client_header_buffer_size 1k;   # Buffer para headers
    large_client_header_buffers 4 8k; # Buffer para headers grandes
    client_max_body_size 1m;        # Limite de tamanho do body
    
    # Timeouts otimizados
    client_body_timeout 12;         # Timeout para recebimento do body
    client_header_timeout 12;       # Timeout para recebimento dos headers
    send_timeout 10;                # Timeout para envio da resposta
    
    # Compressão desabilitada para máxima performance
    gzip off;
    
    # Configuração de resolução DNS
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 9999 reuseport;      # Reuseport para melhor distribuição de carga
        
        # Desabilita logs de acesso para este server específico
        access_log off;
        
        location / {
            # Tentativa de conexão com api01, fallback para api02
            proxy_pass http://api01:8080;
            
            # Timeouts otimizados para APIs de alta performance
            proxy_connect_timeout 3s;     # Reduzido para falha rápida
            proxy_send_timeout 5s;        # Reduzido para melhor responsividade
            proxy_read_timeout 10s;       # Mantido para operações que podem demorar mais
            
            # Configurações de proxy otimizadas
            proxy_buffering off;          # Desabilitado para APIs com responses pequenos
            proxy_request_buffering off;  # Streaming de requests
            proxy_http_version 1.1;       # HTTP/1.1 para keep-alive
            
            # Headers otimizados para keep-alive
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Intercepta erros para fazer fallback
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @api02;
        }
        
        # Localização de fallback para api02
        location @api02 {
            proxy_pass http://api02:8080;
            
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
            
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health check endpoint otimizado
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
