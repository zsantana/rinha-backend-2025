# RINHA BACKEND 2025 - Nginx Optimized for Resource Constraints
# =============================================================

# OTIMIZAÇÃO: Workers ajustados para CPU limitado (0.2 = ~1 core fraction)
# worker_processes 1;
worker_rlimit_nofile 65535;
worker_cpu_affinity auto;

# Minimal logging para economia de resources
# error_log /dev/stderr warn;
# pid /tmp/nginx.pid;

events {
    # OTIMIZAÇÃO: Conexões ajustadas para memory constraint (50MB)
    worker_connections 8192;
    
    # OTIMIZAÇÃO: Performance settings mantidos
    multi_accept on;
    use epoll;
    accept_mutex off;
    accept_mutex_delay 50ms;        # Reduzido para resposta mais rápida
}

http {
    # OTIMIZAÇÃO: Configurações mínimas para economia de memória
    # include /etc/nginx/mime.types;
    # default_type application/octet-stream;

    # OTIMIZAÇÃO: Logs off para economia de I/O e CPU
    access_log off;
    error_log off;

    # OTIMIZAÇÃO: TCP settings para baixo overhead
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # OTIMIZAÇÃO: Configurações de timeout para liberar conexões rapidamente
    client_body_timeout 5s;         # Timeout para receber body
    client_header_timeout 5s;       # Timeout para receber headers
    send_timeout 5s;                # Timeout para enviar resposta
    keepalive_timeout 15s 10s;      # Keepalive mais baixo para liberar conexões
    keepalive_requests 2000;        # Máximo requests por conexão keepalive

     # OTIMIZAÇÃO: Limites de request otimizados
    client_max_body_size 1m;        # Limite body para evitar uso excessivo de CPU
    client_body_buffer_size 8k;     # Buffer pequeno para economia de RAM
    client_header_buffer_size 1k;   # Header buffer mínimo
    large_client_header_buffers 4 4k; # Headers grandes limitados

    # OTIMIZAÇÃO: Proxy buffers otimizados para memory constraint
    proxy_buffering off;           # Desabilita buffering para economizar RAM
    proxy_request_buffering off;   # Stream direto
    proxy_max_temp_file_size 0;     # Sem arquivos temporários

    # OTIMIZAÇÃO: Upstream APENAS para api01 e api02 (api03 é listener)
    upstream rinha_api {
        # Least connections para distribuição eficiente
        least_conn;
        # ip_hash;
        
        # APENAS APIs que recebem HTTP requests
        server api01:8080 max_fails=2 fail_timeout=5s;
        server api02:8080 max_fails=2 fail_timeout=5s;
        
        # OTIMIZAÇÃO: Keepalive moderado para economia de memória
        keepalive 2000;              # Aumentado de 1000 para 2000
        keepalive_requests 10000;    # Mais requests por conexão
        keepalive_timeout 60s;       # Timeout maior para reutilização
    }

    server {
        # OTIMIZAÇÃO: Listen settings para alta performance
        listen 9999 backlog=4096 reuseport deferred so_keepalive=on;
        server_name _;
        
        # OTIMIZAÇÃO: Headers mínimos
        server_tokens off;
        
        # # Health check leve
        # location /health {
        #     return 200 "OK";
        #     add_header Content-Type text/plain;
        # }
        
        # Main location - otimizado para 550 RPS
        location / {
            # OTIMIZAÇÃO: Proxy pass para apenas api01 e api02
            proxy_pass http://rinha_api;
            proxy_http_version 1.1;
            
           # OTIMIZAÇÃO: Headers mínimos essenciais
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            
            # OTIMIZAÇÃO: Timeouts agressivos para throughput
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            
            # OTIMIZAÇÃO: Socket keepalive para reuso de conexões
            proxy_socket_keepalive on;
            
            # OTIMIZAÇÃO: Retry rápido em falha
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 1;
            proxy_next_upstream_timeout 3s;

            # OTIMIZAÇÃO: Intercept errors para evitar overhead
            proxy_intercept_errors off;
        }
    }
}